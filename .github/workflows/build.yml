name: Build exe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: dotnet build src/MyoPresenter.csproj -c Release -o out
      - name: Self-test exe
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process out\MyoPresenter.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\MyoPresenter\log.txt"
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: MyoPresenter
          path: out/MyoPresenter.exe
